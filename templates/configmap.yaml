---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: {{ .Values.configuration.namespace }}
  labels:
    k8s-app: fluent-bit
data:
  parsers.conf: |
    [PARSER]
      Name        docker
      Format      json
      Time_Key    time
      Time_Format %Y-%m-%dT%H:%M:%S.%L
      Time_Keep   On

    [PARSER]
      name kong_log
      format regex
      regex (?<time>[0-9]{4}\/[0-9]{2}\/[0-9]{2}\s[0-9]{2}:[0-9]{2}:[0-9]{2})\s\[(?<level>[a-z]+)\] \d+#\d+: \*\d+ \[(?<emitter>[a-z]+)\] (?<file_name>[a-z|\.]+):(?<file_line>\d+) \[(?<plugin_name>[a-z|\-]+)\] token: (?<token>.+), body: (?<body>.+), client: (?<client>\d+\.\d+\.\d+.\d+), server: kong, request: \\"(?<request>.+)\\", host: \\"(?<host>[a-z|\.]+)\\"
      time_key time
      time_format %Y/%m/%d %H:%M:%S
  fluent-bit.conf: |
    [SERVICE]
      Flush         1
      Log_Level     notice
      Daemon        off
      Parsers_File  /fluent-bit/etc/parsers.conf
      HTTP_Server   On
      HTTP_Listen   0.0.0.0
      HTTP_Port     2020
    
    @INCLUDE kong.conf
  lotus.conf: |
    [INPUT]
      Name              tail
      Tag               kube.*
      Path              /var/log/containers/*network*.log, /var/log/containers/cid-checker*backend*.log
      Exclude_Path      /var/log/containers/*cache-deployment*.log, /var/log/containers/*sync-s3-marketdeals*.log, /var/log/containers/*autoresizer*.log, /var/log/containers/*autoresizer*.log, /var/log/containers/*snapshot*.log, /var/log/containers/*lily*.log
      Parser            docker
      Docker_Mode       On
      DB                /var/log/flb_kube.db
      Mem_Buf_Limit     50MB
      Skip_Long_Lines   On
      Refresh_Interval  10
    
    [FILTER]
      Name                kubernetes
      Match               kube.*
      Kube_URL            https://kubernetes.default.svc:443
      Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
      Kube_Tag_Prefix     kube.var.log.containers.
      Merge_Log           On
      Merge_Log_Key       log_processed
      K8S-Logging.Parser  On
      K8S-Logging.Exclude Off
    
    [OUTPUT]
      Name                es
      Match               kube.*
      Host                {{ .Values.opensearch.configuration.os_domain }}
      Port                443
      TLS                 On
      AWS_Auth            On
      AWS_Region          {{ .Values.opensearch.configuration.aws_region }}
      Retry_Limit         6
      Trace_Error         On
      Logstash_Format     On
      Logstash_Prefix_Key kubernetes['pod_name']
      Logstash_DateFormat %Y.%m
  kong.conf: |
    [INPUT]
      name tail
      path /var/log/containers/*kong_proxy*.log
      tag filecoin_auth
      refresh_interval 10
      buffer_max_size 500m
      buffer_chunk_size 100m
      skip_long_lines Off
      static_batch_size 500m
      db /var/log/kong.db
      parser kong_log
    
    [FILTER]
      name log_to_metrics
      match filecoin_auth
      metric_mode counter
      metric_name authorized_requests
      metric_description This metric counts authorized requests
      regex host [a-z|\.]+
      label_field host
      label_field request
      label_field token
      tag filecoin_auth_metrics
    
    [OUTPUT]
      name  prometheus_exporter
      match filecoin_auth_metrics
      host  0.0.0.0
      port  2021
